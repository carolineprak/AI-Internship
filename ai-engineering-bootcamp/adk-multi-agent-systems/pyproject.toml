[project]
name = "adk-multi-agent-systems"
version = "0.1.0"
description = "Multi-agent AI systems with Google ADK — routing, MCP, and A2A demos"
requires-python = ">=3.12"

dependencies = [
    "google-adk>=1.0.0",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "a2a-sdk>=0.2.0",
    "uvicorn>=0.30.0",
    "streamlit>=1.35.0",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

# Demo scripts are top-level modules, not an import package — avoid setuptools autodiscovers.
[tool.setuptools]
py-modules = [
    "demo1_routing",
    "demo2_mcp",
    "demo3_full_system",
    "shipping_agent",
    "streamlit_app",
    "northwind_rag_agent",
    "northwind_streamlit",
]

